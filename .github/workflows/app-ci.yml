name: Application CI/CD

# Builds the image once, pushes the same digest to both regional registries,
# pre-pulls it on the standby, then deploys to the primary over SSM.
# No stored AWS credentials: the role is assumed through GitHub OIDC.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/deploy.py"
      - "scripts/drlib.py"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: app-deploy
  cancel-in-progress: false

env:
  AWS_REGION_PRIMARY: ${{ vars.AWS_REGION_PRIMARY }}
  AWS_REGION_DR: ${{ vars.AWS_REGION_DR }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: app-deploy

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APP_ARN }}
          aws-region: ${{ vars.AWS_REGION_PRIMARY }}
          role-session-name: drlab-app-${{ github.run_id }}

      - name: Check the application
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          python -m compileall -q app
          python - <<'PY'
          import ast, pathlib
          ast.parse(pathlib.Path("app/app.py").read_text())
          print("app.py parses")
          PY

      - name: Resolve account
        run: |
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Log in to both registries
        run: |
          for region in "$AWS_REGION_PRIMARY" "$AWS_REGION_DR"; do
            aws ecr get-login-password --region "$region" \
              | docker login --username AWS --password-stdin \
                  "${AWS_ACCOUNT_ID}.dkr.ecr.${region}.amazonaws.com"
          done

      - name: Build and push to the primary registry
        run: |
          IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION_PRIMARY}/drlab/app:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --tag "$IMAGE" \
            --push \
            app
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{json .Manifest}}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Pushed $IMAGE as $DIGEST"

      - name: Mirror the same digest to the recovery registry
        run: |
          SRC="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION_PRIMARY}/drlab/app@${DIGEST}"
          DST="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION_DR}/drlab/app:${GITHUB_SHA}"
          docker buildx imagetools create --tag "$DST" "$SRC"
          GOT="$(docker buildx imagetools inspect "$DST" \
            --format '{{json .Manifest}}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          if [ "$GOT" != "$DIGEST" ]; then
            echo "digest mismatch: primary=$DIGEST recovery=$GOT" >&2
            exit 1
          fi
          echo "Both regions resolve $DIGEST"

      - name: Deploy over SSM
        run: |
          pip install -r requirements-dev.txt
          python scripts/deploy.py --digest "$DIGEST" --no-start-standby

      - name: Summary
        run: |
          {
            echo "### Application deployed"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Primary | \`${AWS_REGION_PRIMARY}\` |"
            echo "| Standby | \`${AWS_REGION_DR}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
